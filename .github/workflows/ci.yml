name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: List files
        run: ls -la
      
      - name: Install dependencies
        run: |
          find . -name "package.json" -exec dirname {} \;
          cd $(find . -name "package.json" -exec dirname {} \; | head -1)
          npm install
      
      - name: Run tests
        run: |
          cd $(find . -name "package.json" -exec dirname {} \; | head -1)
          npm test
